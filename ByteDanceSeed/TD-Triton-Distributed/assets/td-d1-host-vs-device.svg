"basic label-container" style="fill:#ffe9b0 !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Triton-distributed（本次主角）：编译器 + 原语 + kernel 库</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B5-9" data-look="classic" transform="translate(175.5, 666)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>特征：SM 在 kernel 内直接 put/get 远端显存，<br />靠信号量同步，通信与计算「空间上」融合</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(14.9296875, 0)"><g class="clusters"><g class="cluster" id="my-svg-A" data-look="classic"><rect style="" x="-6.9296875" y="8" width="364.859375" height="708"/><g class="cluster-label" transform="translate(-2.9296875, 8)"><foreignObject width="356.859375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>A 类：host-initiated（通信是算子之外的独立动作）</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-A1-0" data-look="classic" transform="translate(175.5, 82)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>PyTorch DDP：梯度分桶 + 反向重叠 all-reduce</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A2-1" data-look="classic" transform="translate(175.5, 198)"><rect class="basic label-container" style="" x="-107.65625" y="-27" width="215.3125" height="54"/><g class="label" style="" transform="translate(-77.65625, -12)"><rect/><foreignObject width="155.3125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>ZeRO / ZeRO-Offload</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A3-2" data-look="classic" transform="translate(175.5, 314)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>DualPipe（DeepSeek 官方，最关键的 A 类代表）</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A4-3" data-look="classic" transform="translate(175.5, 442)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>异步 all-gather / 异步 TP / CUDA stream + NCCL 原语</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A5-4" data-look="classic" transform="translate(175.5, 606)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>特征：CPU 下发通信、stream 级并行、通信与计算是<br />两个独立 kernel，靠流水线「时间上」重叠</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>