 transform="translate(468, 35)"><rect class="basic label-container" style="" x="-94.84375" y="-27" width="189.6875" height="54"/><g class="label" style="" transform="translate(-64.84375, -12)"><rect/><foreignObject width="129.6875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>滑窗注意力 (SWA)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G1-2" data-look="classic" transform="translate(138, 223)"><rect class="basic label-container" style="" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>① 全层纯 SWA（已被产业界放弃）<br />Longformer（局部窗口+全局 token）<br />Mistral-7B v0.1/v0.2（W=4096）<br />⚠️ Mistral 自家从 v0.3 起 sliding_window=null</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G2-4" data-look="classic" transform="translate(695.5, 519)"><rect class="basic label-container" style="" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>② 层间混合 SWA（2024 后唯一在用的形态）<br />Gemma-2 1:1 (W=4096) · Gemma-3 5:1 (W=1024)<br />GPT-OSS 1:1 (W=128，奇偶交替)<br />Command A+ 3:1 (W=4096)<br />以【层】为粒度</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G3-6" data-look="classic" transform="translate(1088, 223)"><rect class="basic label-container" style="fill:#ffe9b0 !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>③ token 类型分化 SWA（PHD-SWA）<br />original token：全注意力（长程不丢）<br />hidden decoding token：W=16 局部窗口<br />以【token 类型】为粒度；所有层共用同一 mask</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G4-8" data-look="classic" transform="translate(468, 223)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>④ 推理期免训练 SWA<br />StreamingLLM（sink + 滑窗）</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G5-10" data-look="classic" transform="translate(778, 223)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>⑤ 其他局部化路线（易被误认为 SWA）<br />Llama 4：chunked local attention（8192）<br />Phi-3-small：block-sparse<br />Qwen3-Next：Gated DeltaNet 3:1</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>